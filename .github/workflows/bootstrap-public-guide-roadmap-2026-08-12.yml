name: Bootstrap Field Notes roadmap 2026-08-12

on:
  issues:
    types: [reopened]

permissions:
  contents: read
  issues: write

jobs:
  bootstrap:
    if: github.event.issue.title == '[meta] Bootstrap Field Notes public-guide roadmap'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Create status labels and public-guide milestone
        shell: bash
        run: |
          set -euo pipefail
          log=$(mktemp)
          note() { printf '%s\n' "$*" | tee -a "$log"; }

          ensure_label() {
            name="$1"; color="$2"; description="$3"
            encoded=$(jq -rn --arg value "$name" '$value|@uri')
            if gh api "/repos/${REPO}/labels/${encoded}" >/dev/null 2>&1; then
              note "- ↔️ Label exists: ${name}"
            else
              jq -n --arg name "$name" --arg color "$color" --arg description "$description" \
                '{name:$name,color:$color,description:$description}' \
                | gh api --method POST "/repos/${REPO}/labels" --input - >/dev/null
              note "- ✅ Created label: ${name}"
            fi
          }

          ensure_label 'status: todo' 'FBCA04' 'Approved and ready to begin in the near term'
          ensure_label 'status: in progress' '0E8A16' 'Actively being worked'
          ensure_label 'status: blocked' 'B60205' 'Cannot continue until a dependency or decision is resolved'
          ensure_label 'status: done' '6A737D' 'Completed and closed'

          milestone=$(gh api --paginate "/repos/${REPO}/milestones?state=all&per_page=100" --jq '.[] | select(.title == "Public Field Guides") | .number' | head -1)
          if [ -z "$milestone" ]; then
            jq -n \
              --arg title 'Public Field Guides' \
              --arg description 'Sanitized, reviewed, reusable engineering lessons published for the broader community.' \
              --arg due_on '2026-12-18T23:59:59Z' \
              '{title:$title,description:$description,due_on:$due_on}' \
              | gh api --method POST "/repos/${REPO}/milestones" --input - >/dev/null
            note '- ✅ Created milestone: Public Field Guides → 2026-12-18'
          else
            gh api --method PATCH "/repos/${REPO}/milestones/${milestone}" -f due_on='2026-12-18T23:59:59Z' >/dev/null
            note '- ↔️ Public Field Guides milestone already existed; due date reconciled to 2026-12-18'
          fi

          body=$(cat "$log")
          jq -n --arg body "$body" '{body:$body}' | gh api --method POST "/repos/${REPO}/issues/${ISSUE_NUMBER}/comments" --input - >/dev/null
          gh api --method PATCH "/repos/${REPO}/issues/${ISSUE_NUMBER}" -f state=closed -f state_reason=completed >/dev/null
